<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lumen is a curated online store for beautiful everyday objects — audio, wearables, cameras and more. Free shipping over $150.">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23141519'/%3E%3Ctext x='30' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23fffdf9'%3El%3C/text%3E%3Ccircle cx='45' cy='43' r='5' fill='%23ff5a36'/%3E%3C/svg%3E">
  <title>Lumen — Curated Everyday Objects</title>

  <script>
    // Apply the saved theme before React mounts so dark mode never flashes.
    try {
      var savedTheme = JSON.parse(localStorage.getItem('lumen.theme.v1'));
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
      }
    } catch (error) {
      /* localStorage may be unavailable */
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
